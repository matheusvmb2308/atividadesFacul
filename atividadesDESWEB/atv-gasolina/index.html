<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gasolina ou Alcool</title>
</head>

<body>
    <main>
        <section>
            <form action="#">
                <p>
                    <label for="alcool">Alcool</label>
                    <input type="text" id="alcool">
                </p>
                <p>
                    <label for="gasolina">Gasolina</label>
                    <input type="text" id="gasolina">
                </p>
                <button type="button" onclick="validar()">Validar</button>
            </form>
            <h3></h3>
        </section>
    </main>
    <script>
        function validar(){
            let gasolina = document.getElementById("gasolina").value;
            let alcool = document.getElementById("alcool").value;
            if (parseFloat(alcool) <= parseFloat(gasolina) * 0.7) {
                document.querySelector("h3").innerHTML = "Abastecer com alcool" 
            }
            else {
                document.querySelector("h3").innerHTML = "Abastecer com gasolina" 
            }
        }
    </script>
</body>

</html>
